<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BytePlus Seedream AI Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card: #12141c;
      --border: #1e2230;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    input, select, textarea {
      width: 100%;
      background: #0d0f17;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.95rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 1.75rem;
      display: none;
      text-align: center;
    }
    .result img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .status.loading {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">ModelArk · BytePlus Seedream</span>
    <h1>AI Image Generator</h1>
    <p class="subtitle">Vercel Serverless Backend (60s maxDuration)</p>
  </div>

  <div class="container">
    <div class="form-group">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="3" placeholder="e.g. a red bicycle parked against a brick wall, photorealistic, 8k"></textarea>
    </div>

    <div class="form-group">
      <label for="size">Dimensions</label>
      <select id="size">
        <option value="1024x1024">1:1 Square (1024x1024)</option>
        <option value="1280x720">16:9 Landscape (1280x720)</option>
        <option value="720x1280">9:16 Portrait (720x1280)</option>
      </select>
    </div>

    <button id="genBtn" onclick="generate()">Generate Image</button>

    <div id="status" class="status"></div>

    <div id="result" class="result">
      <img id="resultImg" src="" alt="Generated artwork" />
    </div>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      const size = document.getElementById('size').value;
      const btn = document.getElementById('genBtn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const resultImg = document.getElementById('resultImg');

      if (!prompt) {
        status.textContent = 'Please enter a prompt.';
        status.className = 'status error';
        status.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating... (calling Seedream)';
      status.textContent = 'Dispatching request to /api/generate-image...';
      status.className = 'status loading';
      status.style.display = 'block';
      result.style.display = 'none';

      try {
        const res = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, size })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || data.message || `Request failed with status ${res.status}`);
        }

        const imgUrl = data.url || data?.data?.[0]?.url || data?.outputUrl;
        if (!imgUrl) {
          throw new Error('API succeeded but returned no image URL');
        }

        resultImg.src = imgUrl;
        result.style.display = 'block';
        status.style.display = 'none';
      } catch (err) {
        status.textContent = err.message;
        status.className = 'status error';
        status.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Image';
      }
    }
  </script>
</body>
</html>
